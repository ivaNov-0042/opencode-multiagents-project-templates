<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#1b1f27" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d4f" />
      <stop offset="100%" stop-color="#f5222d" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#30363d" stroke-width="2" />

  <!-- Top Title Banner -->
  <rect x="35" y="32" width="105" height="26" rx="6" fill="#f85149" />
  <text x="87" y="50" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EPISODE 01</text>
  <text x="155" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">协同前夕的修罗场：无序并发与代码覆灭</text>

  <!-- Chaos Grid / Warning Lines in Background -->
  <g opacity="0.15" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="40" y1="280" x2="760" y2="280" />
    <line x1="260" y1="80" x2="260" y2="400" />
    <line x1="530" y1="80" x2="530" y2="400" />
  </g>

  <!-- Giant conflict glitch icon in center background -->
  <circle cx="400" cy="220" r="70" fill="#f85149" opacity="0.08" />
  <text x="400" y="235" font-family="monospace" font-size="64" font-weight="900" fill="#f85149" opacity="0.25" text-anchor="middle">CONFLICT!</text>

  <!-- ================= CHARACTER 1: Coder Agent (Orange Hoodie) ================= -->
  <g transform="translate(130, 260)" filter="url(#shadow)">
    <!-- Shock effect -->
    <path d="M-60 -50 L-40 -40 M-65 -20 L-45 -15 M-50 10 L-35 5" stroke="#ff7b72" stroke-width="3" stroke-linecap="round" />
    <!-- Body -->
    <rect x="-24" y="20" width="48" height="50" rx="12" fill="#d9572b" />
    <!-- Hoodie Strings -->
    <line x1="-8" y1="26" x2="-8" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="26" x2="8" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Head -->
    <circle cx="0" cy="-10" r="32" fill="#f0883e" />
    <!-- Headband -->
    <path d="M-31 -18 Q0 -28 31 -18 L31 -8 Q0 -18 -31 -8 Z" fill="#21262d" />
    <text x="0" y="-12" font-family="monospace" font-size="9" fill="#79c0ff" font-weight="bold" text-anchor="middle">&gt; dev _</text>
    <!-- Scared eyes (swirls/X) -->
    <text x="-11" y="-2" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">X</text>
    <text x="11" y="-2" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">X</text>
    <!-- Screaming Mouth -->
    <ellipse cx="0" cy="10" rx="10" ry="7" fill="#5c1d00" />
    <!-- Sweat drop -->
    <path d="M26 -30 C26 -30 33 -20 33 -15 C33 -10 28 -8 24 -11 C20 -14 26 -30 26 -30 Z" fill="#79c0ff" />
    <!-- Hands tearing paper -->
    <circle cx="-32" cy="35" r="9" fill="#f0883e" />
    <circle cx="32" cy="35" r="9" fill="#f0883e" />
    <!-- Torn Code Paper -->
    <path d="M-25 25 L-5 20 L-10 55 L-30 50 Z" fill="#ffffff" stroke="#ff7b72" stroke-width="2" />
    <path d="M5 20 L25 25 L30 50 L10 55 Z" fill="#ffffff" stroke="#ff7b72" stroke-width="2" />
    <text x="-17" y="38" font-family="monospace" font-size="8" fill="#f85149" font-weight="bold">main.</text>
    <text x="17" y="38" font-family="monospace" font-size="8" fill="#f85149" font-weight="bold">py</text>
  </g>
  <!-- Speech Bubble Coder -->
  <g transform="translate(140, 110)" filter="url(#shadow)">
    <rect x="-100" y="-35" width="200" height="55" rx="12" fill="url(#bubbleGrad)" stroke="#ff7b72" stroke-width="2" />
    <polygon points="-10,20 10,20 0,35" fill="#161b22" />
    <polygon points="-11,20 0,35 1,20" fill="#161b22" stroke="#ff7b72" stroke-width="2" />
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#161b22" stroke-width="3" />
    <text x="0" y="-12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="bold" fill="#ff7b72" text-anchor="middle">谁改了我的 main.py？！</text>
    <text x="0" y="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">我辛辛苦苦写的 300 行全没了！</text>
  </g>

  <!-- ================= CHARACTER 2: Antigravity Agent (Me!) ================= -->
  <!-- Floating in the middle, upside-down / spinning from confusion -->
  <g transform="translate(400, 275)" filter="url(#shadow)">
    <!-- Antigravity thruster rings & dizzy sparkles -->
    <ellipse cx="0" cy="55" rx="20" ry="6" fill="none" stroke="#7ee787" stroke-width="2" stroke-dasharray="4 3" opacity="0.8" />
    <circle cx="-35" cy="-45" r="3" fill="#7ee787" />
    <path d="M-40 -50 L-30 -40 M-40 -40 L-30 -50" stroke="#7ee787" stroke-width="1.5" />
    <circle cx="35" cy="-45" r="3" fill="#79c0ff" />
    <!-- Antigravity Jet Body -->
    <rect x="-22" y="16" width="44" height="42" rx="10" fill="#1f6feb" />
    <!-- Floating antigravity side wings -->
    <path d="M-22 25 L-36 15 L-22 35 Z" fill="#388bfd" />
    <path d="M22 25 L36 15 L22 35 Z" fill="#388bfd" />
    <!-- Jetpack nozzle spark -->
    <polygon points="-8,58 0,72 8,58" fill="#58a6ff" opacity="0.8" />
    <polygon points="-4,58 0,66 4,58" fill="#ffffff" />
    <!-- Character Head -->
    <circle cx="0" cy="-14" r="30" fill="#58a6ff" />
    <!-- Visor (Curved high-tech VR Goggles) -->
    <rect x="-24" y="-22" width="48" height="18" rx="8" fill="#0d1117" stroke="#7ee787" stroke-width="2" />
    <!-- Visor Glitch Display -->
    <text x="0" y="-10" font-family="monospace" font-size="9" fill="#7ee787" font-weight="bold" text-anchor="middle">AGY:404_ID</text>
    <!-- Confused Spiral Mouth -->
    <path d="M-7 4 Q-3 10 0 4 T7 4" fill="none" stroke="#0d1117" stroke-width="2.5" stroke-linecap="round" />
    <!-- Antenna with question mark -->
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#58a6ff" stroke-width="3" />
    <circle cx="0" cy="-58" r="5" fill="#7ee787" />
    <text x="14" y="-55" font-family="sans-serif" font-size="18" font-weight="bold" fill="#7ee787">?</text>
    <!-- Floating Hands -->
    <circle cx="-32" cy="18" r="8" fill="#58a6ff" />
    <circle cx="32" cy="18" r="8" fill="#58a6ff" />
  </g>
  <!-- Speech Bubble Antigravity -->
  <g transform="translate(400, 100)" filter="url(#shadow)">
    <rect x="-115" y="-35" width="230" height="55" rx="12" fill="url(#bubbleGrad)" stroke="#79c0ff" stroke-width="2" />
    <polygon points="-10,20 10,20 0,35" fill="#161b22" />
    <polygon points="-11,20 0,35 1,20" fill="#161b22" stroke="#79c0ff" stroke-width="2" />
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#161b22" stroke-width="3" />
    <text x="0" y="-12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="bold" fill="#79c0ff" text-anchor="middle">我是 Antigravity……但我是哪号？</text>
    <text x="0" y="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">没有身份名册，我不知道谁抢了谁！</text>
  </g>

  <!-- ================= CHARACTER 3: Analyst Agent (Yellow/Purple Cap) ================= -->
  <g transform="translate(650, 260)" filter="url(#shadow)">
    <!-- Body -->
    <rect x="-24" y="20" width="48" height="50" rx="12" fill="#8957e5" />
    <!-- Head -->
    <circle cx="0" cy="-10" r="32" fill="#d2a8ff" />
    <!-- Detective / Beret Cap -->
    <path d="M-32 -25 C-32 -40 32 -40 32 -25 C35 -20 30 -15 25 -20 C10 -25 -10 -25 -25 -20 Z" fill="#e3b341" />
    <circle cx="0" cy="-38" r="4" fill="#f0883e" />
    <!-- Stressed Eyes -->
    <line x1="-18" y1="-12" x2="-6" y2="-6" stroke="#21262d" stroke-width="3" stroke-linecap="round" />
    <line x1="-18" y1="-6" x2="-6" y2="-12" stroke="#21262d" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="-12" x2="18" y2="-6" stroke="#21262d" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="-6" x2="18" y2="-12" stroke="#21262d" stroke-width="3" stroke-linecap="round" />
    <!-- Wavy mouth -->
    <path d="M-10 10 Q-5 4 0 10 T10 10" fill="none" stroke="#21262d" stroke-width="2.5" />
    <!-- Hands holding tablet with overwritten notes -->
    <circle cx="-30" cy="30" r="9" fill="#d2a8ff" />
    <circle cx="30" cy="30" r="9" fill="#d2a8ff" />
    <rect x="-22" y="24" width="44" height="34" rx="4" fill="#0d1117" stroke="#ffa657" stroke-width="1.5" />
    <text x="0" y="44" font-family="monospace" font-size="8" fill="#f85149" text-anchor="middle">OVERWRITE!</text>
  </g>
  <!-- Speech Bubble Analyst -->
  <g transform="translate(640, 110)" filter="url(#shadow)">
    <rect x="-105" y="-35" width="210" height="55" rx="12" fill="url(#bubbleGrad)" stroke="#ffa657" stroke-width="2" />
    <polygon points="-10,20 10,20 0,35" fill="#161b22" />
    <polygon points="-11,20 0,35 1,20" fill="#161b22" stroke="#ffa657" stroke-width="2" />
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#161b22" stroke-width="3" />
    <text x="0" y="-12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="bold" fill="#ffa657" text-anchor="middle">笔记也互相覆盖了……</text>
    <text x="0" y="8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">没有锁机制，多人改文件必丢更新！</text>
  </g>

  <!-- Bottom Summary Card -->
  <rect x="40" y="415" width="720" height="50" rx="10" fill="#161b22" stroke="#30363d" />
  <circle cx="65" cy="440" r="14" fill="#f85149" opacity="0.2" />
  <text x="65" y="445" font-family="sans-serif" font-size="16" fill="#f85149" font-weight="bold" text-anchor="middle">!</text>
  <text x="95" y="438" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc">痛点总结：普通多窗口 / 多 Agent 并不等于协作！</text>
  <text x="95" y="454" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">没有身份协议 → 相互冒认；没有跨进程加锁 → 保存即覆灭；没有统一单一事实源 → 记录互咬打架。</text>
</svg>
