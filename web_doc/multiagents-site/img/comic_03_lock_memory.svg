<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2cc60" />
      <stop offset="100%" stop-color="#d29922" />
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#0d419d" />
    </linearGradient>
    <linearGradient id="bubbleGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad3)" />
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#30363d" stroke-width="2" />

  <!-- Top Title Banner -->
  <rect x="35" y="32" width="105" height="26" rx="6" fill="#1f6feb" />
  <text x="87" y="50" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EPISODE 03</text>
  <text x="155" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">施工请挂锁与记忆单一事实源</text>

  <!-- Divider Line -->
  <line x1="390" y1="80" x2="390" y2="400" stroke="#30363d" stroke-dasharray="4 4" stroke-width="2" />

  <!-- ================= LEFT HALF: CROSS-PROCESS LOCK (agentctl file) ================= -->
  <g transform="translate(190, 260)" filter="url(#shadow3)">
    <!-- Security / Lock Zone Grid -->
    <rect x="-160" y="-120" width="320" height="225" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.5" />
    <rect x="-160" y="-120" width="320" height="26" rx="12" fill="#d29922" opacity="0.2" />
    <text x="0" y="-103" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="bold" fill="#f2cc60" text-anchor="middle">跨进程文件锁 · flock + 原子替换</text>

    <!-- Workbench Table -->
    <rect x="-140" y="20" width="160" height="65" rx="6" fill="#21262d" stroke="#30363d" stroke-width="2" />
    <!-- File on table -->
    <rect x="-115" y="5" width="45" height="55" rx="3" fill="#ffffff" stroke="#79c0ff" stroke-width="1.5" />
    <line x1="-105" y1="18" x2="-80" y2="18" stroke="#1f6feb" stroke-width="2" />
    <line x1="-105" y1="26" x2="-85" y2="26" stroke="#8b949e" stroke-width="1.5" />
    <line x1="-105" y1="34" x2="-75" y2="34" stroke="#8b949e" stroke-width="1.5" />
    <text x="-92" y="50" font-family="monospace" font-size="7" fill="#1f6feb" text-anchor="middle">.py</text>

    <!-- Big Shiny Brass Padlock -->
    <g transform="translate(-40, 15)">
      <!-- Shackle -->
      <path d="M-10 0 C-10 -18 10 -18 10 0" fill="none" stroke="#f2cc60" stroke-width="6" stroke-linecap="round" />
      <!-- Lock Body -->
      <rect x="-18" y="0" width="36" height="30" rx="6" fill="url(#lockGrad)" stroke="#fff" stroke-width="1.5" />
      <circle cx="0" cy="12" r="3" fill="#0d1117" />
      <polygon points="-2,13 2,13 1,20 -1,20" fill="#0d1117" />
      <!-- Sparkle -->
      <text x="14" y="0" font-family="sans-serif" font-size="12" fill="#fff">✨</text>
    </g>

    <!-- Antigravity working diligently with builder helmet -->
    <g transform="translate(-100, -35)">
      <!-- Body -->
      <rect x="-16" y="10" width="32" height="32" rx="8" fill="#1f6feb" />
      <!-- Head -->
      <circle cx="0" cy="-10" r="22" fill="#58a6ff" />
      <!-- Builder Yellow Helmet -->
      <path d="M-22 -14 C-22 -32 22 -32 22 -14 Z" fill="#f2cc60" />
      <rect x="-24" y="-14" width="48" height="5" rx="2" fill="#d29922" />
      <circle cx="0" cy="-22" r="4" fill="#ffffff" /> <!-- Headlamp -->
      <!-- Confident Eyes -->
      <circle cx="-7" cy="-7" r="2.5" fill="#0d1117" />
      <circle cx="7" cy="-7" r="2.5" fill="#0d1117" />
      <path d="M-4 3 Q0 6 4 3" fill="none" stroke="#0d1117" stroke-width="2" />
      <!-- Holding digital quill/tool -->
      <circle cx="18" cy="18" r="6" fill="#58a6ff" />
      <line x1="18" y1="18" x2="26" y2="28" stroke="#7ee787" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Queue Waiting Area (Right side of left half) -->
    <g transform="translate(85, -20)">
      <!-- Lounge Armchair -->
      <rect x="-35" y="30" width="70" height="40" rx="8" fill="#30363d" />
      <rect x="-30" y="15" width="60" height="25" rx="6" fill="#21262d" />
      <!-- Coder Agent sitting politely sipping tea -->
      <circle cx="0" cy="5" r="18" fill="#f0883e" />
      <!-- Cute relaxed curved eyes ^_^ -->
      <path d="M-10 2 Q-6 -3 -2 2" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" />
      <path d="M2 2 Q6 -3 10 2" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" />
      <!-- Boba cup -->
      <rect x="8" y="18" width="14" height="20" rx="3" fill="#ffffff" stroke="#30363d" />
      <line x1="15" y1="12" x2="20" y2="22" stroke="#f85149" stroke-width="2" />
      <!-- Traffic Light -->
      <rect x="42" y="-40" width="16" height="38" rx="4" fill="#0d1117" stroke="#30363d" />
      <circle cx="50" cy="-30" r="4" fill="#f85149" opacity="0.3" />
      <circle cx="50" cy="-20" r="4" fill="#f2cc60" />
      <circle cx="50" cy="-10" r="4" fill="#7ee787" opacity="0.3" />
    </g>
  </g>
  <!-- Lock Speech Bubble -->
  <g transform="translate(190, 85)" filter="url(#shadow3)">
    <rect x="-105" y="-25" width="210" height="45" rx="10" fill="url(#bubbleGrad3)" stroke="#f2cc60" stroke-width="1.5" />
    <polygon points="-10,20 10,20 0,30" fill="#161b22" />
    <polygon points="-10,20 0,30 1,20" fill="#161b22" stroke="#f2cc60" stroke-width="1.5" />
    <line x1="-9" y1="20" x2="9" y2="20" stroke="#161b22" stroke-width="2" />
    <text x="0" y="-6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="bold" fill="#f2cc60" text-anchor="middle">写通用文件先拿锁！</text>
    <text x="0" y="10" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">原子写入 + edits.jsonl 审计留痕</text>
  </g>

  <!-- ================= RIGHT HALF: SSOT MEMORY ================= -->
  <g transform="translate(580, 260)" filter="url(#shadow3)">
    <!-- Vault Box -->
    <rect x="-160" y="-120" width="320" height="225" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
    <rect x="-160" y="-120" width="320" height="26" rx="12" fill="#1f6feb" opacity="0.2" />
    <text x="0" y="-103" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="bold" fill="#79c0ff" text-anchor="middle">记忆单一事实源 (SSOT) · state/memory/ 与 .md 视图</text>

    <!-- Physical Safe (JSON Source) on Left -->
    <g transform="translate(-85, 5)">
      <rect x="-55" y="-60" width="110" height="135" rx="8" fill="#0d1117" stroke="#388bfd" stroke-width="2" />
      <!-- Safe dial -->
      <circle cx="0" cy="-25" r="16" fill="#21262d" stroke="#58a6ff" stroke-width="2" />
      <line x1="0" y1="-35" x2="0" y2="-15" stroke="#7ee787" stroke-width="2" />
      <text x="0" y="4" font-family="monospace" font-size="9" font-weight="bold" fill="#79c0ff" text-anchor="middle">{ JSON 事实源 }</text>
      <!-- Drawers -->
      <rect x="-45" y="15" width="90" height="20" rx="3" fill="#161b22" stroke="#30363d" />
      <text x="-40" y="29" font-family="monospace" font-size="7" fill="#7ee787">## Antigravity</text>
      <rect x="-45" y="40" width="90" height="20" rx="3" fill="#161b22" stroke="#30363d" />
      <text x="-40" y="54" font-family="monospace" font-size="7" fill="#ffa657">## 02_static</text>
    </g>

    <!-- Holographic Beam Arrow -->
    <path d="M-20 0 L15 0" stroke="#7ee787" stroke-width="3" stroke-dasharray="4 2" />
    <polygon points="15,-5 25,0 15,5" fill="#7ee787" />
    <text x="0" y="-10" font-family="monospace" font-size="8" fill="#7ee787" text-anchor="middle">自动导出</text>

    <!-- Holographic Screen (Markdown View) on Right -->
    <g transform="translate(85, 5)">
      <rect x="-55" y="-60" width="110" height="135" rx="8" fill="#1f6feb11" stroke="#7ee787" stroke-width="1.5" />
      <rect x="-55" y="-60" width="110" height="18" rx="8" fill="#7ee787" opacity="0.2" />
      <text x="0" y="-47" font-family="monospace" font-size="8" font-weight="bold" fill="#7ee787" text-anchor="middle">MEMORY.md (人读)</text>
      <!-- Formatted lines of text -->
      <line x1="-45" y1="-25" x2="-10" y2="-25" stroke="#79c0ff" stroke-width="3" stroke-linecap="round" />
      <line x1="-45" y1="-15" x2="25" y2="-15" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-45" y1="-7" x2="35" y2="-7" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" />

      <line x1="-45" y1="12" x2="-15" y2="12" stroke="#ffa657" stroke-width="3" stroke-linecap="round" />
      <line x1="-45" y1="22" x2="30" y2="22" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" />
      <line x1="-45" y1="30" x2="10" y2="30" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" />

      <circle cx="35" cy="55" r="8" fill="#238636" />
      <text x="35" y="58" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">✓</text>
    </g>
  </g>
  <!-- Memory Speech Bubble -->
  <g transform="translate(580, 85)" filter="url(#shadow3)">
    <rect x="-105" y="-25" width="210" height="45" rx="10" fill="url(#bubbleGrad3)" stroke="#79c0ff" stroke-width="1.5" />
    <polygon points="-10,20 10,20 0,30" fill="#161b22" />
    <polygon points="-10,20 0,30 1,20" fill="#161b22" stroke="#79c0ff" stroke-width="1.5" />
    <line x1="-9" y1="20" x2="9" y2="20" stroke="#161b22" stroke-width="2" />
    <text x="0" y="-6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="bold" fill="#79c0ff" text-anchor="middle">分节追加，永不冲突！</text>
    <text x="0" y="10" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">机器读写 JSON，人类查看 Markdown</text>
  </g>

  <!-- Bottom Summary Card -->
  <rect x="40" y="415" width="720" height="50" rx="10" fill="#161b22" stroke="#30363d" />
  <circle cx="65" cy="440" r="14" fill="#1f6feb" opacity="0.2" />
  <text x="65" y="445" font-family="sans-serif" font-size="16" fill="#58a6ff" font-weight="bold" text-anchor="middle">★</text>
  <text x="95" y="438" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="bold" fill="#f0f6fc">写入与存储规约：挂锁施工 + 双层记忆</text>
  <text x="95" y="454" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">agentctl.py file 跨进程加锁保障并发无缝排队；记忆按主题/小节分块落盘，彻底告别单文件盲目覆写。</text>
</svg>
